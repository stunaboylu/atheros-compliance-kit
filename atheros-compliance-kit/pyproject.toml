[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atheros-compliance-kit"
version = "1.0.0"
description = "AtherosAI Compliance Kit — EU AI Act and ISO/IEC 42001 evidence from inside your own codebase and CI: RAG bias and data-quality scoring, third-party LLM guardrails, risk classification with Annex IV dossiers, and vendor assessment. English and Turkish."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-AtherosAI-Commercial" }
authors = [{ name = "AtherosAI B.V." }]
keywords = ["eu-ai-act", "iso-42001", "ai-governance", "llm-guardrails", "rag-evaluation", "compliance", "pii", "prompt-injection"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

# The core is stdlib-only, on purpose: `pip install atheros-compliance-kit` in a CI
# image must not pull a vector-store driver, an LLM SDK, or a PDF engine. Every
# capability that needs one is an extra with a lazy import and a named error.
dependencies = []

[project.optional-dependencies]
rag  = ["numpy>=1.24", "chromadb>=0.5; python_version>='3.10'", "pgvector>=0.3", "psycopg2-binary>=2.9"]
llm  = ["google-genai>=1.0.0", "openai>=1.40.0", "PyYAML>=6.0"]
pdf  = ["jinja2>=3.1.4", "weasyprint>=62.0"]
yaml = ["PyYAML>=6.0"]
all  = ["atheros-compliance-kit[rag,llm,pdf,yaml]"]
dev  = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
atheros-kit = "atheros_kit.cli:main"

[project.urls]
Homepage = "https://atherosai.com/compliance-kit"
Documentation = "https://atherosai.com/compliance-kit/en/quickstart.html"
Repository = "https://github.com/stunaboylu/atherosai_compliance_kit"
Changelog = "https://github.com/stunaboylu/atherosai_compliance_kit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/atheros_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# The rule set is pinned explicitly rather than left to ruff's default.
#
# The default moves between ruff releases, so an unpinned selection means a
# dependency upgrade can turn CI red on code nobody touched — and a lint that
# fails for reasons unrelated to the change under review is a lint people learn
# to skip. Adding a rule should be a decision recorded here, not something that
# arrives with a patch bump.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "W",   # pycodestyle, minus E501 — see line-length below
    "F",                     # pyflakes — unused imports and names
    "I",                     # import ordering
    "UP",                    # pyupgrade — the codebase targets 3.10+
    "B",                     # bugbear — real bug shapes
    "SIM",                   # simplifiable constructs
    "FURB",                  # modernisation
]
ignore = [
    # `zip(...)` without `strict=`. Every zip here walks two lists built together
    # in the same function; `strict=True` would be noise on 3.10, which the
    # package still targets.
    "B905",
]

# DELIBERATELY NOT SELECTED, with reasons — so the next person can re-enable one
# on purpose rather than wonder whether it was ever considered:
#
#   RUF001/002/003  ambiguous unicode. 936 hits, essentially all of them Turkish
#                   text and typographic punctuation in the message catalogue.
#                   The rule guards against homoglyphs in IDENTIFIERS; applying
#                   it to a bilingual product's prose would mean either ASCII-only
#                   Turkish or a noqa on every second line.
#   PLC0415         imports inside functions. That is the architecture: every
#                   optional extra is lazily imported so the core stays
#                   dependency-free, and a CI job asserts it.
#   PLW0603         `global`. The three module-level caches (config, licence,
#                   model config) are deliberate, documented, and each has a
#                   setter for tests.
#   E501            line length. Enforced at 100 by the formatter's own wrapping;
#                   the exceptions are long legal strings and generated HTML,
#                   where breaking the line makes the content harder to read than
#                   the overflow does.
#   DTZ011          `date.today()`. Licence expiry and vendor staleness are
#                   calendar-day questions in the operator's timezone, not
#                   instants — UTC would expire a licence a day early west of
#                   Greenwich.

[tool.ruff.lint.per-file-ignores]
# Tests assert on long literals and hold fixture data that reads as mutable class
# state to a static analyser.
"tests/*" = ["RUF012"]

[tool.atheros]
# Default CI gate config; `atheros.yml` in the repo root overrides it.
audit_file = ".atheros/audit_trail.jsonl"
report_dir = ".atheros/reports"
