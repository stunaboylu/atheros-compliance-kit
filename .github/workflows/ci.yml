# Every push and pull request. Three gates, in the order that fails fastest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the package declares; 3.13 is where it will be run.
        # Windows is here because `core.audit` takes a POSIX file lock when one is
        # available and must stay correct when it is not — the fallback path is
        # otherwise only ever exercised by someone else, in production.
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: atheros-compliance-kit
        run: pip install -e '.[dev]'
      - name: Lint
        working-directory: atheros-compliance-kit
        run: ruff check src tests
      - name: Test
        working-directory: atheros-compliance-kit
        run: pytest -q --cov=atheros_kit --cov-report=term-missing

  no-hidden-dependencies:
    # The core's stdlib-only promise is a promise about what `pip install` pulls
    # into a locked-down CI image. It is checked here rather than trusted, because
    # a single convenience import in a future PR would silently break it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with NO extras
        working-directory: atheros-compliance-kit
        run: pip install .
      - name: Assert the core imports nothing third-party
        run: |
          python - <<'PY'
          import subprocess, sys
          # A fresh interpreter, so nothing this workflow imported is counted.
          # Modules the interpreter or venv injects before any of our code runs.
          # Counting them would make this check fail on every developer machine and
          # then be switched off — which is how the promise it guards quietly dies.
          code = (
              "import sys, atheros_kit.core\n"
              "INJECTED = {'sitecustomize', 'usercustomize', 'apport_python_hook',\n"
              "            '_distutils_hack', 'pkg_resources'}\n"
              "stdlib = set(sys.stdlib_module_names)\n"
              "extra = sorted(\n"
              "    m for m in sys.modules\n"
              "    if not m.startswith(('atheros_kit', '_'))\n"
              "    and m.split('.')[0] not in stdlib\n"
              "    and m.split('.')[0] not in INJECTED\n"
              ")\n"
              "print(extra)\n"
              "raise SystemExit(1 if extra else 0)\n"
          )
          r = subprocess.run([sys.executable, "-c", code], capture_output=True, text=True)
          print(r.stdout, r.stderr)
          if r.returncode:
              sys.exit("atheros_kit.core imported a third-party module: " + r.stdout.strip())
          PY
      - name: Assert every module runs with no network and no key
        working-directory: atheros-compliance-kit
        env:
          # Deliberately empty: this is the supported default, not a broken state.
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          atheros-kit doctor
          atheros-kit euact classify --name CI --sector devtools --use-case "static analysis"
          atheros-kit vendor assess openai --region EU || true
          atheros-kit audit verify

  self-assessment:
    # We run the product on itself, and the run is a release gate. If the Kit
    # stops being able to assess the Kit, nothing else in this repo matters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - working-directory: atheros-compliance-kit
        run: pip install -e .
      - run: python scripts/self_assessment.py --check
      - name: Fail if the committed self-assessment is stale
        # The committed report must match what the code produces now — a stale
        # self-assessment is a claim about a version that no longer exists. This
        # covers the published pages too: they are the copy the public reads.
        run: |
          git diff --exit-code -- SELF_ASSESSMENT.md \
            site/content/en/self-assessment.md \
            site/content/tr/self-assessment.md
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: self-assessment
          path: SELF_ASSESSMENT.md

  determinism:
    # Same input + same version + same regulation version → the same report,
    # modulo timestamps and session id. A compliance tool that answers
    # differently on a re-run cannot be used as evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - working-directory: atheros-compliance-kit
        run: pip install -e .
      - run: |
          python - <<'PY'
          import json, re, sys
          sys.path.insert(0, "atheros-compliance-kit/src")
          from atheros_kit.euact import SystemSpec, classify, generate_dossier
          from atheros_kit.vendor import assess

          def stable(text: str) -> str:
              # Strip the two fields that are SUPPOSED to differ.
              text = re.sub(r'"generated_at": "[^"]*"', '"generated_at": "X"', text)
              return re.sub(r'"session_id": "[^"]*"', '"session_id": "X"', text)

          spec = SystemSpec("Det", "hr", ["cv screening"])
          a = stable(json.dumps(generate_dossier(classify(spec)).to_dict(), sort_keys=True))
          b = stable(json.dumps(generate_dossier(classify(spec)).to_dict(), sort_keys=True))
          assert a == b, "dossier is not deterministic"

          x = stable(assess("openai").report.to_json())
          y = stable(assess("openai").report.to_json())
          assert x == y, "vendor assessment is not deterministic"
          print("deterministic")
          PY

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - working-directory: console
        run: npm ci
      - working-directory: console
        run: npm run typecheck
      - working-directory: console
        run: npm run build:web
      - name: Assert the export carries content, not just a shell
        # The screens seed from the bundled fixture synchronously so static export
        # renders real content. If that regresses, every exported page silently
        # becomes an empty spinner and nobody notices until a customer hosts it.
        working-directory: console
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          def text(name):
              html = pathlib.Path("dist", name).read_text()
              return " ".join(re.sub(r"<[^>]+>", " ", html).split())
          checks = {
              "index.html": ["Compliance gate", "fairness_score"],
              "risk.html": ["TalentFlow", "Annex III"],
              "rag.html": ["hiring-knowledge-base"],
              "vendor.html": ["OpenAI"],
          }
          bad = [f"{f}:{p}" for f, ps in checks.items() for p in ps if p not in text(f)]
          sys.exit("static export is missing content: " + ", ".join(bad) if bad else 0)
          PY

  site:
    # The copy lint applied to marketing. Nobody writes "guaranteed compliant" into
    # a finding; everybody is tempted to write it into a hero, and the hero is the
    # page a regulator would read first.
    #
    # This job also builds the COMBINED public output — exactly what the
    # atherosai.com build copies under /compliance-kit/. Verifying it here means
    # a broken deploy shows up on the pull request rather than as a 404 on the
    # company site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Measure the product (the site states no hand-written numbers)
        run: |
          # The [dev] extra, because the count comes from pytest itself.
          pip install -e 'atheros-compliance-kit[dev]'
          python scripts/collect_facts.py --print

      - name: Fail if the committed facts are stale
        # site/facts.json is committed so the hosting build can render the site
        # without the Python package. That only works while the committed copy is
        # true, and nothing else would notice if it drifted.
        run: git diff --exit-code -- site/facts.json

      - name: Build the site (fails on banned phrasing or a missing canonical)
        run: python site/build.py

      - name: Build the public output (site + console demo) — what atherosai.com serves
        run: python scripts/build_public.py

      - name: Assert the deployment is actually servable
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          out = pathlib.Path("public")
          problems = []

          # Every page the site links to must exist, and the demo must be reachable
          # from it — the link was added the moment a demo URL existed, and a
          # 404 there is the first thing a prospect would hit.
          #
          # Links are root-absolute under the served path and carry no `.html`
          # (site/build.py, BASE_PATH): `/compliance-kit/en/quickstart` is the
          # file `en/quickstart.html`, and `/compliance-kit/en` is `en/index.html`.
          # Resolve the way the host does.
          base = "/compliance-kit"
          for page in list((out / "en").glob("*.html")) + [out / "index.html"]:
              for href in re.findall(r'href="([^"#]+)"', page.read_text()):
                  if href.startswith(("http", "mailto:")):
                      continue
                  if not href.startswith(base + "/"):
                      problems.append(f"{page.name} -> {href}: not under {base}/")
                      continue
                  rel = href[len(base) + 1:]
                  candidates = [out / rel, out / f"{rel}.html", out / rel / "index.html"]
                  if not any(c.is_file() for c in candidates):
                      problems.append(f"{page.name} -> {href}")

          # The console is exported for the path it will be served from
          # (/compliance-kit/demo, from SITE_URL). An export whose base did not
          # take still returns 200 for every page and 404 for every script, so
          # nothing notices but the browser. Every root-absolute reference in the
          # demo must start with that base — build_public.py checks the same.
          demo_base = "/compliance-kit/demo/"
          for page in (out / "demo").rglob("*.html"):
              for asset in re.findall(r'(?:src|href)="(/[^"]*)"', page.read_text()):
                  if not asset.startswith(demo_base):
                      problems.append(f"{page.name}: {asset} is not under {demo_base}")
          if not (out / "robots.txt").read_text().count(f"Disallow: {demo_base}"):
              problems.append("robots.txt does not disallow the demo at its served path")

          for required in ["index.html", "en/index.html", "tr/index.html",
                           "demo/index.html", "demo/risk.html",
                           "robots.txt", "sitemap.xml", "llms.txt"]:
              if not (out / required).exists():
                  problems.append(f"missing {required}")

          # The root URL is the most-linked one. It used to be a script redirect,
          # so anything that does not run JavaScript — which is every generative
          # engine's fetcher — received an empty body from it.
          root = (out / "index.html").read_text()
          visible = " ".join(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ",
                                    root, flags=re.S).split())
          if len(visible) < 400:
              problems.append(f"root page has only {len(visible)} chars of text without JS")
          if 'rel="canonical"' not in root or "ld+json" not in root:
              problems.append("root page is missing a canonical or JSON-LD")

          # Every locale page must be citable: canonical, hreflang, structured data.
          for page in list((out / "en").glob("*.html")) + list((out / "tr").glob("*.html")):
              html = page.read_text()
              for needle, label in [('rel="canonical"', "canonical"),
                                    ('hreflang="x-default"', "x-default"),
                                    ("application/ld+json", "JSON-LD"),
                                    ('property="og:title"', "Open Graph")]:
                  if needle not in html:
                      problems.append(f"{page.parent.name}/{page.name}: no {label}")

          sys.exit("public build is not servable:\n  " + "\n  ".join(problems)
                   if problems else 0)
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: public
          path: public/
